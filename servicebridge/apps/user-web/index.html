<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="customer-service-api-base" content="">
    <meta name="description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="在线客服">
    <meta property="og:description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta property="og:image" content="./assets/001.png">
    <meta property="og:url" content="./index.html">
    <meta property="og:site_name" content="在线客服">
    <meta itemprop="name" content="在线客服">
    <meta itemprop="description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta itemprop="image" content="./assets/001.png">
    <link rel="image_src" href="./assets/001.png">
    <title>在线客服</title>
    <script src="/servicebridge-config.js"></script>
    <script src="./assets/chat-boot.js"></script>
    <link href="./assets/tailwind.css" rel="stylesheet">
    <script src="./assets/vendor/gsap/gsap.min.js"></script>
    <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="./assets/chat.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen w-screen relative">

    <!-- PC端模拟手机外壳，移动端全屏 -->
    <div id="app-container" class="relative w-full h-full md:w-[400px] md:h-[800px] md:max-h-[95vh] md:rounded-xl md:shadow-2xl overflow-hidden bg-wc-bg flex flex-col">
        <div id="entry-view" class="absolute inset-0 z-30 bg-white flex items-center justify-center px-8">
            <div class="entry-view-inner">
                <img src="./assets/001.png" alt="咨询客服入口图片" data-i18n-alt="entryImageAlt" class="entry-hero">
                <button id="entry-btn" class="w-full max-w-[220px] bg-[#07c160] text-white py-3 rounded-lg text-[17px] font-medium active:bg-[#06ad56]" data-action="open-consultation" data-i18n="consultService">
                    咨询客服
                </button>
            </div>
        </div>

        <div id="chat-shell" class="w-full h-full flex flex-col hidden">
            <!-- 顶部导航栏 -->
            <header class="h-[50px] bg-wc-header flex items-center justify-between px-3 shrink-0 relative z-20 border-b border-wc">
                <!-- 左侧空位保持布局平衡，移除了返回按钮 -->
                <div class="flex items-center w-16">
                </div>
                
                <!-- 中间标题与状态 -->
                <div class="flex-1 flex flex-col items-center justify-center text-center">
                    <div class="flex items-center gap-1">
                        <span id="header-title" class="text-[17px] font-semibold text-wc-main truncate max-w-[150px]" data-i18n="officialService">官方客服</span>
                        <!-- AI 标识 -->
                        <span id="header-ai-badge" class="bg-blue-100 text-blue-600 text-[10px] px-1 rounded-sm border border-blue-200">AI</span>
                    </div>
                    <!-- 打字状态提示 (默认隐藏) -->
                    <span id="header-typing" class="text-xs text-gray-500 hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-wc-header px-3 whitespace-nowrap text-center" dir="auto" data-i18n="typing">
                        对方正在输入...
                    </span>
                </div>
                
                <!-- 右侧更多 -->
                <div class="flex items-center justify-end w-16 gap-3">
                    <i id="btn-sound" class="fas fa-volume-up text-lg text-gray-700 cursor-pointer"></i>
                    <i id="btn-more-top" class="fas fa-ellipsis-h text-xl text-gray-700 cursor-pointer" title="结束会话等操作" data-i18n-title="moreActionsTitle"></i>
                </div>
            </header>

            <!-- 系统提示横幅 (排队/营业时间等) -->
            <div id="sys-banner" class="bg-[#fdf6ec] text-[#e6a23c] text-xs px-3 py-2 flex items-center justify-center border-b border-[#faecd8] hidden shrink-0 z-10 shadow-sm relative">
                <span id="sys-banner-text" data-i18n="notice">提示信息</span>
                <i class="fas fa-times absolute right-3 cursor-pointer text-[#e6a23c]" data-action="dismiss-parent"></i>
            </div>

            <!-- 聊天内容区 -->
            <main id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-5 hide-scrollbar pb-6 relative z-0" data-action="close-panels">
                <!-- 历史记录拉取提示 -->
                <div class="text-center" id="history-anchor">
                    <span id="load-history" class="text-xs text-blue-500 cursor-pointer hover:underline" data-action="load-older" data-i18n="loadMoreHistory">点击加载更多历史记录</span>
                </div>
            </main>

            <!-- 底部输入与功能区 -->
            <footer class="bg-wc-footer border-t border-wc shrink-0 pb-safe relative z-20">
                <!-- 输入行 -->
                <div class="min-h-[56px] px-2 py-2 flex items-end gap-2">
                    <!-- 语音切换 (纯展示图标) -->
                    <div id="btn-voice" class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer select-none">
                        <i class="fas fa-microphone-alt text-2xl text-gray-700 rounded-full border border-gray-500 p-1.5 w-8 h-8 flex items-center justify-center"></i>
                    </div>
                    
                    <!-- 输入框 -->
                    <div class="flex-1 bg-white rounded flex items-center border border-gray-300 min-h-[40px] mb-0.5 relative">
                        <textarea id="chat-input" rows="1" class="h-10 w-full bg-transparent border-none resize-none px-2 py-2 text-[16px] leading-[22px] max-h-[100px] hide-scrollbar"></textarea>
                    </div>
                    
                    <!-- 表情按钮 -->
                    <div class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer" data-action="toggle-panel" data-arg="emoji">
                        <i class="far fa-smile text-3xl text-gray-700"></i>
                    </div>
                    
                    <!-- 更多(+)按钮 / 发送按钮 (动态切换) -->
                    <div id="btn-plus" class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer" data-action="toggle-panel" data-arg="more">
                        <i class="fas fa-plus-circle text-3xl text-gray-700"></i>
                    </div>
                    <div id="btn-send" class="hidden h-8 bg-[#07c160] text-white px-4 rounded font-medium text-[15px] items-center justify-center shrink-0 mb-1 cursor-pointer active:bg-[#06ad56]" data-action="send" data-i18n="send">
                        发送
                    </div>
                </div>

                <!-- 隐藏的表情面板 -->
                <div id="panel-emoji" class="bottom-panel h-0 bg-wc-footer border-t border-gray-200">
                    <div class="p-4 grid grid-cols-8 gap-4 overflow-y-auto h-[250px] hide-scrollbar" id="emoji-container">
                        <!-- JS 填充 -->
                    </div>
                </div>

                <!-- 隐藏的更多功能面板 -->
                <div id="panel-more" class="bottom-panel h-0 bg-wc-footer border-t border-gray-200">
                    <div class="p-6 grid grid-cols-4 gap-y-6 gap-x-2 h-[250px]">
                        
                        <!-- 1. 发送照片 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" data-action="trigger" data-arg="photo">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-image text-[28px] text-gray-600"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="album">相册</span>
                        </div>

                        <!-- 2. 电话联系 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" data-action="trigger" data-arg="phone">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-phone-alt text-[24px] text-gray-600"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="phoneContact">电话联系</span>
                        </div>

                        <!-- 3. 加 WhatsApp -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" data-action="trigger" data-arg="whatsapp">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fab fa-whatsapp text-[32px] text-[#25D366]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="addWhatsapp">加WhatsApp</span>
                        </div>

                        <!-- 4. 加 Telegram -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" data-action="trigger" data-arg="telegram">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fab fa-telegram text-[30px] text-[#2AABEE]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="addTelegram">加Telegram</span>
                        </div>

                        <!-- 5. 转人工客服 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" data-action="trigger" data-arg="human">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-headset text-[26px] text-[#07c160]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="transferToHuman">转人工</span>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <!-- 评价遮罩层 (底部弹起，类似微信的小程序面板) -->
        <div id="eval-overlay" class="absolute inset-0 bg-black/50 z-50 hidden flex-col justify-end">
            <div class="bg-white rounded-t-xl w-full pt-4 pb-8 px-6 transform translate-y-full" id="eval-sheet">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-medium text-gray-800" data-i18n="serviceRating">服务评价</h3>
                    <i class="fas fa-times text-gray-400 cursor-pointer text-xl p-2" data-action="close-eval"></i>
                </div>
                
                <p class="text-sm text-gray-500 mb-6 text-center" data-i18n="ratingDescription">会话已结束，请对本次服务（在线客服）进行评价</p>
                
                <div class="flex justify-around mb-8">
                    <div class="flex flex-col items-center gap-2 cursor-pointer eval-star" data-score="5">
                        <i class="fas fa-laugh-squint text-4xl text-gray-300 transition-colors"></i>
                        <span class="text-xs text-gray-500" data-i18n="verySatisfied">非常满意</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 cursor-pointer eval-star" data-score="3">
                        <i class="fas fa-meh text-4xl text-gray-300 transition-colors"></i>
                        <span class="text-xs text-gray-500" data-i18n="neutral">一般</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 cursor-pointer eval-star" data-score="1">
                        <i class="fas fa-frown text-4xl text-gray-300 transition-colors"></i>
                        <span class="text-xs text-gray-500" data-i18n="unsatisfied">不满意</span>
                    </div>
                </div>

                <div id="eval-advice-box" class="hidden mb-5">
                    <label class="block text-sm text-gray-600 mb-2" data-i18n="feedbackLabel">请告诉我们哪里做得不够好</label>
                    <textarea
                        id="eval-advice"
                        class="w-full min-h-[96px] bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 resize-none focus:outline-none focus:border-[#07c160]"
                        maxlength="300"
                        placeholder="请输入您的建议，客服团队会看到这条反馈" data-i18n-placeholder="feedbackPlaceholder"
                    ></textarea>
                </div>

                <button class="w-full bg-[#07c160] text-white py-3 rounded-lg font-medium active:bg-[#06ad56]" data-action="submit-eval" data-i18n="submitRating">提交评价</button>
            </div>
        </div>

        <div id="end-confirm-overlay" class="end-confirm-overlay hidden">
            <div id="end-confirm-sheet" class="end-confirm-sheet">
                <div class="end-confirm-body">
                    <div class="end-confirm-title" data-i18n="endConfirmTitle">确认要结束当前会话吗？</div>
                    <div class="end-confirm-desc" data-i18n="endConfirmDescription">结束后将返回咨询客服入口</div>
                </div>
                <div class="end-confirm-actions">
                    <button id="end-confirm-cancel" type="button" class="end-confirm-btn cancel" data-i18n="cancel">取消</button>
                    <button id="end-confirm-submit" type="button" class="end-confirm-btn danger" data-i18n="end">结束</button>
                </div>
            </div>
        </div>

        <!-- 居中 Toast 提示 -->
        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-[14px] px-4 py-2 rounded shadow-lg pointer-events-none opacity-0 z-[60]" data-i18n="notice">
            提示信息
        </div>

        <div id="record-overlay" class="absolute inset-0 z-[65] hidden items-end justify-center pointer-events-none">
            <div class="record-overlay-stack">
                <div id="record-overlay-card" class="record-overlay-card bg-black/80 text-white rounded-2xl px-6 py-5 text-center min-w-[188px] shadow-lg">
                    <i class="fas fa-microphone-alt text-3xl mb-3"></i>
                    <div id="record-overlay-text" class="text-[15px] font-medium" data-i18n="releaseToSend">松开发送语音</div>
                    <div id="record-overlay-tip" class="text-[12px] text-white/80 mt-2" data-i18n="slideUpToCancelArea">上滑进入取消区域</div>
                </div>
                <div id="record-overlay-cancel" class="record-cancel-bar">
                    <i class="fas fa-times-circle text-[14px]"></i>
                    <span id="record-overlay-cancel-text" data-i18n="slideUpToCancel">上滑取消发送</span>
                </div>
            </div>
        </div>

        <!-- 隐藏的音频 -->
        <audio id="sound-new-msg" src="./assets/audio/new-message.mp3" preload="auto"></audio>
        <input id="upload-image-input" type="file" accept="image/*" class="hidden">
    </div>

    <script src="./assets/i18n.js"></script>
    <script src="./assets/chat.js"></script>
</body>
</html>
