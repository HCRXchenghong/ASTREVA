<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="customer-service-api-base" content="">
    <meta name="description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="在线客服">
    <meta property="og:description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta property="og:image" content="./assets/001.png">
    <meta property="og:url" content="./index.html">
    <meta property="og:site_name" content="在线客服">
    <meta itemprop="name" content="在线客服">
    <meta itemprop="description" content="点击进入在线客服，有问题随时咨询，我们会尽快为您处理。">
    <meta itemprop="image" content="./assets/001.png">
    <link rel="image_src" href="./assets/001.png">
    <title>在线客服</title>
    <script>
        (() => {
            if (new URLSearchParams(window.location.search).get('embed') === '1') {
                document.documentElement.classList.add('embed-mode');
            }
        })();
    </script>
    <script>
        (() => {
            const shareImageURL = new URL('./assets/001.png', window.location.href).href;
            const sharePageURL = window.location.href.split('#')[0];
            const metas = [
                ['meta[property="og:image"]', 'content', shareImageURL],
                ['meta[itemprop="image"]', 'content', shareImageURL],
                ['meta[property="og:url"]', 'content', sharePageURL],
                ['link[rel="image_src"]', 'href', shareImageURL]
            ];
            metas.forEach(([selector, attr, value]) => {
                const el = document.querySelector(selector);
                if (el) el.setAttribute(attr, value);
            });
        })();
    </script>
    <link href="./assets/tailwind.css" rel="stylesheet">
    <script src="./assets/vendor/gsap/gsap.min.js"></script>
    <link href="./assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --wc-bg: #ededed;          /* 微信聊天背景色 */
            --wc-header: #ededed;      /* 微信顶部导航栏颜色 */
            --wc-footer: #f7f7f7;      /* 微信底部输入区颜色 */
            --wc-bubble-user: #95ec69; /* 微信自己发的消息绿色 */
            --wc-bubble-ai: #ffffff;   /* 微信对方发的消息白色 */
            --wc-text-main: #111111;
            --wc-text-muted: #b2b2b2;
            --wc-border: #d5d5d5;
        }

        /* "正在回复"输入中的三个小点动画 */
        .typing-dots { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; }
        /* 顶部"正在回复"提示：宽度自适应、不换行、不被截断 */
        #header-typing { white-space: nowrap; max-width: 78%; overflow: visible; }
        .typing-dots span {
            width: 7px; height: 7px; border-radius: 9999px; background: #9aa7b4;
            animation: typing-blink 1.2s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes typing-blink {
            0%, 80%, 100% { opacity: .25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Segoe UI, Arial, Roboto, 'PingFang SC', 'miui', 'Hiragino Sans GB', 'Microsoft Yahei', sans-serif;
            background-color: #333; /* PC端大背景设为深色，突出中间的手机外壳 */
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        html.embed-mode body {
            background: transparent;
        }

        html.embed-mode #app-container {
            width: 100vw !important;
            height: 100vh !important;
            max-height: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        html.embed-mode #entry-view {
            border-radius: 0;
            background: var(--wc-bg);
        }

        html.embed-mode #entry-view .entry-view-inner {
            display: none;
        }

        /* === B13：阿拉伯语 RTL 适配（气泡三角、边距、横幅） === */
        html[dir="rtl"] .bubble-left::before {
            left: auto;
            right: -5px;
            border-width: 5px 0 5px 6px;
            border-color: transparent transparent transparent var(--wc-bubble-ai);
        }

        html[dir="rtl"] .bubble-right::before {
            right: auto;
            left: -5px;
            border-width: 5px 6px 5px 0;
            border-color: transparent var(--wc-bubble-user) transparent transparent;
        }

        html[dir="rtl"] .voice-bubble-btn {
            direction: rtl;
        }

        html[dir="rtl"] .voice-duration {
            text-align: left;
        }

        html[dir="rtl"] .msg-wrapper .ml-1 {
            margin-left: 0;
            margin-right: 0.25rem;
        }

        html[dir="rtl"] .msg-wrapper .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }

        html[dir="rtl"] .quick-replies-card .text-left {
            text-align: right;
        }

        html[dir="rtl"] #sys-banner > i.fa-times {
            right: auto;
            left: 0.75rem;
        }

        html[dir="rtl"] #header-typing {
            left: auto;
            right: 50%;
            transform: translateX(50%);
        }

        /* 隐藏滚动条但保留滚动能力 */
        html, body, * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* 气泡小三角 (左侧 - 对方) */
        .bubble-left::before {
            content: '';
            position: absolute;
            top: 14px;
            left: -5px;
            border-width: 5px 6px 5px 0;
            border-style: solid;
            border-color: transparent var(--wc-bubble-ai) transparent transparent;
        }

        /* 气泡小三角 (右侧 - 自己) */
        .bubble-right::before {
            content: '';
            position: absolute;
            top: 14px;
            right: -5px;
            border-width: 5px 0 5px 6px;
            border-style: solid;
            border-color: transparent transparent transparent var(--wc-bubble-user);
        }

        /* 图片消息的无尖角包裹层 */
        .bubble-image img {
            border-radius: 6px;
            max-width: 140px;
            max-height: 200px;
            object-fit: cover;
        }

        .bubble-audio {
            min-width: 132px;
            max-width: 220px;
            padding: 0 !important;
            overflow: hidden;
        }

        .voice-bubble-btn {
            width: 100%;
            min-height: 44px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            font: inherit;
            color: inherit;
            cursor: pointer;
        }

        .voice-bubble-btn:focus {
            outline: none;
        }

        .voice-bubble-btn.voice-playing {
            opacity: 0.88;
        }

        .voice-play-icon {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(17, 17, 17, 0.08);
            font-size: 10px;
            flex-shrink: 0;
        }

        .voice-bubble-self .voice-play-icon {
            background: rgba(17, 17, 17, 0.12);
        }

        .voice-wave {
            display: inline-flex;
            align-items: flex-end;
            gap: 3px;
            flex: 1;
            min-width: 28px;
        }

        .voice-wave i {
            display: block;
            width: 3px;
            border-radius: 999px;
            background: rgba(17, 17, 17, 0.7);
        }

        .voice-wave i:nth-child(1) { height: 10px; opacity: 0.65; }
        .voice-wave i:nth-child(2) { height: 15px; }
        .voice-wave i:nth-child(3) { height: 20px; opacity: 0.8; }

        .voice-bubble-btn.voice-playing .voice-wave i {
            animation: voiceWavePulse 0.9s ease-in-out infinite;
        }

        .voice-bubble-btn.voice-playing .voice-wave i:nth-child(2) {
            animation-delay: 0.12s;
        }

        .voice-bubble-btn.voice-playing .voice-wave i:nth-child(3) {
            animation-delay: 0.24s;
        }

        @keyframes voiceWavePulse {
            0%, 100% { transform: scaleY(0.72); opacity: 0.55; }
            50% { transform: scaleY(1.05); opacity: 1; }
        }

        .voice-duration {
            font-size: 12px;
            color: rgba(17, 17, 17, 0.72);
            flex-shrink: 0;
            min-width: 28px;
            text-align: right;
        }

        .voice-bubble-self .voice-duration {
            color: rgba(17, 17, 17, 0.8);
        }

        .voice-audio-element {
            display: none;
        }

        .bubble-revoked {
            background-color: #f3f4f6 !important;
            color: #6b7280 !important;
            border: 1px solid #e5e7eb !important;
            font-size: 14px !important;
        }

        .record-overlay-card {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .record-overlay-card.record-cancel {
            background: rgba(220, 38, 38, 0.92);
        }

        .record-overlay-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-bottom: 72px;
        }

        .record-cancel-bar {
            min-width: 168px;
            min-height: 40px;
            padding: 0 18px;
            border-radius: 999px;
            background: rgba(17, 17, 17, 0.08);
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(17, 17, 17, 0.06);
            transition: all 0.16s ease;
        }

        .record-cancel-bar.record-cancel-active {
            background: rgba(220, 38, 38, 0.12);
            color: #dc2626;
            border-color: rgba(220, 38, 38, 0.22);
            transform: scale(1.04);
        }

        .end-confirm-overlay {
            position: absolute;
            inset: 0;
            z-index: 70;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0.58);
            opacity: 0;
        }

        .end-confirm-overlay.hidden {
            display: none;
        }

        .end-confirm-sheet {
            width: 100%;
            min-height: 224px;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow: hidden;
            background: #ffffff;
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -18px 42px rgba(0, 0, 0, 0.12);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
            transform: translateY(100%);
            will-change: transform;
        }

        .end-confirm-body {
            padding: 34px 32px 24px;
            text-align: center;
        }

        .end-confirm-title {
            color: #111111;
            font-size: 20px;
            font-weight: 600;
            line-height: 32px;
        }

        .end-confirm-desc {
            color: #4b5563;
            font-size: 15px;
            line-height: 26px;
            margin-top: 10px;
        }

        .end-confirm-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 36px;
        }

        .end-confirm-btn {
            flex: 1;
            height: 50px;
            border: 0;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
        }

        .end-confirm-btn.cancel {
            background: #f4f4f4;
            color: #111111;
        }

        .end-confirm-btn.cancel:active {
            background: #e9e9e9;
        }

        .end-confirm-btn.danger {
            background: #ff4d4f;
            color: #ffffff;
        }

        .end-confirm-btn.danger:active {
            background: #f04446;
        }

        #btn-voice i {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid #cfcfcf;
            background: #ffffff;
            font-size: 17px;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 1px rgba(17, 17, 17, 0.04);
            transition: all 0.18s ease;
        }

        #btn-voice.recording i {
            background: #07c160;
            border-color: #07c160;
            color: #ffffff;
        }

        #btn-voice {
            touch-action: none;
        }

        /* 输入框自动增高，取消聚焦边框 */
        textarea:focus { outline: none; }
        
        /* 底部安全区适配 */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

        /* 面板动画基础设置 */
        .bottom-panel {
            will-change: height;
            overflow: hidden;
        }

        /* 强制覆盖部分 tailwind 配置 */
        .bg-wc-bg { background-color: var(--wc-bg); }
        .bg-wc-header { background-color: var(--wc-header); }
        .bg-wc-footer { background-color: var(--wc-footer); }
        .bg-wc-user { background-color: var(--wc-bubble-user); }
        .bg-wc-ai { background-color: var(--wc-bubble-ai); }
        .border-wc { border-color: var(--wc-border); }
        .text-wc-main { color: var(--wc-text-main); }

        .entry-view-inner {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .entry-hero {
            width: min(88vw, 340px);
            max-height: 42vh;
            object-fit: contain;
            filter: drop-shadow(0 18px 30px rgba(17, 17, 17, 0.12));
            transform-origin: center center;
            animation: entryHeroFloat 5s ease-in-out infinite;
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes entryHeroFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.02);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen relative">

    <!-- PC端模拟手机外壳，移动端全屏 -->
    <div id="app-container" class="relative w-full h-full md:w-[400px] md:h-[800px] md:max-h-[95vh] md:rounded-xl md:shadow-2xl overflow-hidden bg-wc-bg flex flex-col">
        <div id="entry-view" class="absolute inset-0 z-30 bg-white flex items-center justify-center px-8">
            <div class="entry-view-inner">
                <img src="./assets/001.png" alt="咨询客服入口图片" data-i18n-alt="entryImageAlt" class="entry-hero">
                <button id="entry-btn" class="w-full max-w-[220px] bg-[#07c160] text-white py-3 rounded-lg text-[17px] font-medium active:bg-[#06ad56]" onclick="openConsultation()" data-i18n="consultService">
                    咨询客服
                </button>
            </div>
        </div>

        <div id="chat-shell" class="w-full h-full flex flex-col hidden">
            <!-- 顶部导航栏 -->
            <header class="h-[50px] bg-wc-header flex items-center justify-between px-3 shrink-0 relative z-20 border-b border-wc">
                <!-- 左侧空位保持布局平衡，移除了返回按钮 -->
                <div class="flex items-center w-16">
                </div>
                
                <!-- 中间标题与状态 -->
                <div class="flex-1 flex flex-col items-center justify-center text-center">
                    <div class="flex items-center gap-1">
                        <span id="header-title" class="text-[17px] font-semibold text-wc-main truncate max-w-[150px]" data-i18n="officialService">官方客服</span>
                        <!-- AI 标识 -->
                        <span id="header-ai-badge" class="bg-blue-100 text-blue-600 text-[10px] px-1 rounded-sm border border-blue-200">AI</span>
                    </div>
                    <!-- 打字状态提示 (默认隐藏) -->
                    <span id="header-typing" class="text-xs text-gray-500 hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-wc-header px-3 whitespace-nowrap text-center" dir="auto" data-i18n="typing">
                        对方正在输入...
                    </span>
                </div>
                
                <!-- 右侧更多 -->
                <div class="flex items-center justify-end w-16 gap-3">
                    <i id="btn-sound" class="fas fa-volume-up text-lg text-gray-700 cursor-pointer"></i>
                    <i id="btn-more-top" class="fas fa-ellipsis-h text-xl text-gray-700 cursor-pointer" title="结束会话等操作" data-i18n-title="moreActionsTitle"></i>
                </div>
            </header>

            <!-- 系统提示横幅 (排队/营业时间等) -->
            <div id="sys-banner" class="bg-[#fdf6ec] text-[#e6a23c] text-xs px-3 py-2 flex items-center justify-center border-b border-[#faecd8] hidden shrink-0 z-10 shadow-sm relative">
                <span id="sys-banner-text" data-i18n="notice">提示信息</span>
                <i class="fas fa-times absolute right-3 cursor-pointer text-[#e6a23c]" onclick="this.parentElement.classList.add('hidden')"></i>
            </div>

            <!-- 聊天内容区 -->
            <main id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-5 hide-scrollbar pb-6 relative z-0" onclick="closeAllPanels()">
                <!-- 历史记录拉取提示 -->
                <div class="text-center" id="history-anchor">
                    <span id="load-history" class="text-xs text-blue-500 cursor-pointer hover:underline" onclick="loadOlderMessages()" data-i18n="loadMoreHistory">点击加载更多历史记录</span>
                </div>
            </main>

            <!-- 底部输入与功能区 -->
            <footer class="bg-wc-footer border-t border-wc shrink-0 pb-safe relative z-20">
                <!-- 输入行 -->
                <div class="min-h-[56px] px-2 py-2 flex items-end gap-2">
                    <!-- 语音切换 (纯展示图标) -->
                    <div id="btn-voice" class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer select-none">
                        <i class="fas fa-microphone-alt text-2xl text-gray-700 rounded-full border border-gray-500 p-1.5 w-8 h-8 flex items-center justify-center"></i>
                    </div>
                    
                    <!-- 输入框 -->
                    <div class="flex-1 bg-white rounded flex items-center border border-gray-300 min-h-[40px] mb-0.5 relative">
                        <textarea id="chat-input" rows="1" class="w-full bg-transparent border-none resize-none px-2 py-2 text-[16px] leading-[22px] max-h-[100px] hide-scrollbar" style="height: 40px;"></textarea>
                    </div>
                    
                    <!-- 表情按钮 -->
                    <div class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer" onclick="togglePanel('emoji')">
                        <i class="far fa-smile text-3xl text-gray-700"></i>
                    </div>
                    
                    <!-- 更多(+)按钮 / 发送按钮 (动态切换) -->
                    <div id="btn-plus" class="w-8 h-8 flex items-center justify-center shrink-0 mb-1 cursor-pointer" onclick="togglePanel('more')">
                        <i class="fas fa-plus-circle text-3xl text-gray-700"></i>
                    </div>
                    <div id="btn-send" class="h-8 bg-[#07c160] text-white px-4 rounded font-medium text-[15px] flex items-center justify-center shrink-0 mb-1 cursor-pointer active:bg-[#06ad56]" style="display: none;" onclick="handleSend()" data-i18n="send">
                        发送
                    </div>
                </div>

                <!-- 隐藏的表情面板 -->
                <div id="panel-emoji" class="bottom-panel h-0 bg-wc-footer border-t border-gray-200">
                    <div class="p-4 grid grid-cols-8 gap-4 overflow-y-auto h-[250px] hide-scrollbar" id="emoji-container">
                        <!-- JS 填充 -->
                    </div>
                </div>

                <!-- 隐藏的更多功能面板 -->
                <div id="panel-more" class="bottom-panel h-0 bg-wc-footer border-t border-gray-200">
                    <div class="p-6 grid grid-cols-4 gap-y-6 gap-x-2 h-[250px]">
                        
                        <!-- 1. 发送照片 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="triggerAction('photo')">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-image text-[28px] text-gray-600"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="album">相册</span>
                        </div>

                        <!-- 2. 电话联系 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="triggerAction('phone')">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-phone-alt text-[24px] text-gray-600"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="phoneContact">电话联系</span>
                        </div>

                        <!-- 3. 加 WhatsApp -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="triggerAction('whatsapp')">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fab fa-whatsapp text-[32px] text-[#25D366]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="addWhatsapp">加WhatsApp</span>
                        </div>

                        <!-- 4. 加 Telegram -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="triggerAction('telegram')">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fab fa-telegram text-[30px] text-[#2AABEE]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="addTelegram">加Telegram</span>
                        </div>

                        <!-- 5. 转人工客服 -->
                        <div class="flex flex-col items-center gap-1 cursor-pointer group" onclick="triggerAction('human')">
                            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm group-active:bg-gray-100">
                                <i class="fas fa-headset text-[26px] text-[#07c160]"></i>
                            </div>
                            <span class="text-xs text-gray-500" data-i18n="transferToHuman">转人工</span>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <!-- 评价遮罩层 (底部弹起，类似微信的小程序面板) -->
        <div id="eval-overlay" class="absolute inset-0 bg-black/50 z-50 hidden flex-col justify-end">
            <div class="bg-white rounded-t-xl w-full pt-4 pb-8 px-6 transform translate-y-full" id="eval-sheet">

        // === 工具函数 ===
        function inferAPIBase() {

        function clearVisitorSession() {

        function loadVisitorSession() {

                const parsed = JSON.parse(raw);

                const rawSessionType = ACTIVE_SESSION_TYPES.has(parsed?.sessionType) ? parsed.sessionType : 'AI';

                if (!visitorToken || !conversationId) {
                    clearVisitorSession();
                    return null;

                return {
                    visitorToken,
                    conversationId,
                    sessionType

        function escapeHTML(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function resolveAssetURL(value) {
            value = String(value || '');
            if (!value) return '';
            if (/^https?:\/\//i.test(value) || value.startsWith('data:')) return value;
            if (value.startsWith('/')) return State.apiBase.replace(/\/$/, '') + value;
            return value;
        }

        function safeImageSrc(value) {
            const resolved = resolveAssetURL(value);
            if (/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(resolved)) return resolved;
            try {
                const parsed = new URL(resolved, location.href);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
            } catch (err) {}
            return '';
        }

        function isEmbedMode() {
            return document.documentElement.classList.contains('embed-mode');
        }

        function notifyHost(type, payload = {}) {
            if (!isEmbedMode() || window.parent === window) return;
            window.parent.postMessage({ type, ...payload }, '*');
        }

        // === 主站一级存储桥 ===
        // 聊天窗口是跨站 iframe（api.astreva.ltd），其 localStorage 会被 Safari ITP /
        // 隐私模式等第三方存储拦截，导致刷新后丢会话。这里通过 postMessage 请主站
        // 页面（第一方）代为保存访客会话令牌，刷新后再向主站取回，即可恢复会话与历史。
        function hostTargetOrigin() {
            try {
                const referrer = new URL(document.referrer);
                if (referrer.protocol === 'http:' || referrer.protocol === 'https:') {
                    return referrer.origin;
                }
            } catch (err) {}
            return '*';
        }

        function isFramed() {
            try { return window.self !== window.top; } catch (err) { return true; }
        }

        function notifyHostSessionSave(session) {
            if (!isFramed() || window.parent === window) return;
            try {
                window.parent.postMessage({ type: 'servicebridge:session-put', session }, hostTargetOrigin());
            } catch (err) {}
        }

        function notifyHostSessionClear() {
            if (!isFramed() || window.parent === window) return;
            try {
                window.parent.postMessage({ type: 'servicebridge:session-clear' }, hostTargetOrigin());
            } catch (err) {}
        }

        // 向主站请求访客会话；超时或主站未托管时返回 null。
        function requestHostSession(timeoutMs) {
            return new Promise((resolve) => {
                if (!isFramed() || window.parent === window) { resolve(null); return; }
                let settled = false;
                const finish = (session) => {
                    if (settled) return;
                    settled = true;
                    window.removeEventListener('message', onMessage);
                    resolve(session);
                };
                const onMessage = (event) => {
                    if (event.source !== window.parent) return;
                    const data = event.data || {};
                    if (data.type !== 'servicebridge:session-restore') return;
                    const raw = data.session;
                    const visitorToken = String(raw?.visitorToken || '').trim();
                    const conversationId = String(raw?.conversationId || '').trim();
                    if (!visitorToken || !conversationId) { finish(null); return; }
                    let sessionType = ACTIVE_SESSION_TYPES.has(raw?.sessionType) ? raw.sessionType : 'AI';
                    if (sessionType === 'QUEUING') sessionType = 'AI';
                    finish({ visitorToken, conversationId, sessionType });
                };
                window.addEventListener('message', onMessage);
                try {
                    window.parent.postMessage({ type: 'servicebridge:session-get' }, hostTargetOrigin());
                } catch (err) {}
                setTimeout(() => finish(null), timeoutMs || 800);
            });
        }

        function voicePoint(event) {
            if (event && event.touches && event.touches[0]) {
                return { x: event.touches[0].clientX || 0, y: event.touches[0].clientY || 0 };
            }
            if (event && event.changedTouches && event.changedTouches[0]) {
                return { x: event.changedTouches[0].clientX || 0, y: event.changedTouches[0].clientY || 0 };
            }
            return { x: event?.clientX || 0, y: event?.clientY || 0 };
        }

        function isWithinCancelZone(clientX, clientY) {
            if (!clientX || !clientY || DOM.recordOverlay.classList.contains('hidden')) return false;
            const rect = DOM.recordOverlayCancel.getBoundingClientRect();
            const expand = 18;
            return clientX >= rect.left - expand &&
                clientX <= rect.right + expand &&
                clientY >= rect.top - expand &&
                clientY <= rect.bottom + expand;
        }

        function beginVoiceGesture(event, source) {
            if (State.sessionType === 'ENDED' || State.recordGestureSource) return;
            const point = voicePoint(event);
            State.recordGestureSource = source;
            State.recordPointerId = source === 'pointer' ? event.pointerId ?? null : null;
            State.recordPendingStop = false;
            State.recordPendingForceCancel = false;
            State.recordingCanceled = false;
            State.recordingStartY = point.y || 0;
            if (source === 'pointer' && typeof DOM.btnVoice.setPointerCapture === 'function' && event.pointerId != null) {
                try {
                    DOM.btnVoice.setPointerCapture(event.pointerId);
                } catch (err) {}
            }
            event.preventDefault();
            startVoiceRecording(point.y || 0);
        }

        function bindAudioBubbleActions(root) {
            root.querySelectorAll('[data-audio-bubble]').forEach((button) => {
                if (button.dataset.boundAudio === '1') return;
                button.dataset.boundAudio = '1';
                const wrapper = button.closest('.bubble-audio');
                const audio = wrapper ? wrapper.querySelector('.voice-audio-element') : null;
                const durationText = button.querySelector('[data-audio-duration]');
                if (!audio) return;
                const syncDuration = () => {
                    if (!durationText) return;
                    if (Number.isFinite(audio.duration) && audio.duration > 0) {
                        durationText.textContent = `${Math.max(1, Math.round(audio.duration))}"`;
                    } else {
                        durationText.textContent = t('voice');
                    }
                };
                audio.addEventListener('loadedmetadata', syncDuration);
                audio.addEventListener('ended', () => {
                    if (State.activeAudioElement === audio) {
                        State.activeAudioElement = null;
                        State.activeAudioButton = null;
                    }
                    setAudioBubbleState(button, false);
                });
                audio.addEventListener('pause', () => {
                    if (!audio.ended) {
                        setAudioBubbleState(button, false);
                    }
                });
                if (audio.readyState >= 1) {
                    syncDuration();
                }
                button.addEventListener('click', async () => {
                    if (State.activeAudioElement && State.activeAudioElement !== audio) {
                        stopCurrentAudio(true);
                    }
                    if (audio.paused) {
                        try {
                            State.activeAudioElement = audio;
                            State.activeAudioButton = button;
                            setAudioBubbleState(button, true);
                            await audio.play();
                        } catch (err) {
                            console.error(err);
                            stopCurrentAudio(false);
                            showToast(t('voicePlayFailed'));
                        }
                        return;
                    }
                    stopCurrentAudio(true);
                });
            });
        }

        function messageDataAttrs(meta = {}) {
            const attrs = [];
            if (meta.serverMsgId) attrs.push(`data-server-msg-id="${escapeHTML(meta.serverMsgId)}"`);
            if (meta.clientMsgId) attrs.push(`data-client-msg-id="${escapeHTML(meta.clientMsgId)}"`);
            // B15：失败重发所需的元数据。
            if (meta.msgType) attrs.push(`data-msg-type="${escapeHTML(meta.msgType)}"`);
            if (meta.displayText) attrs.push(`data-display-text="${escapeHTML(meta.displayText)}"`);
            if (meta.retryText) attrs.push(`data-retry-text="${escapeHTML(meta.retryText)}"`);
            return attrs.join(' ');
        }

        // B15：失败消息统一的重试图标。
        function retryIconHTML(retryText) {
            const safeRetryText = escapeHTML(retryText).replace(/\n/g, '&#10;');
            return `<i class="fas fa-exclamation-circle text-red-500 text-xl mx-2 cursor-pointer retry-icon" role="button" tabindex="0" title="${escapeHTML(t('tapToRetry'))}" aria-label="${escapeHTML(t('tapToRetry'))}" data-retry-text="${safeRetryText}"></i>`;
        }

        function findMessageElement(meta = {}) {
            const items = DOM.chatList.querySelectorAll('.msg-wrapper');
            for (const item of items) {
                if (meta.serverMsgId && item.dataset.serverMsgId === meta.serverMsgId) return item;
                if (meta.clientMsgId && item.dataset.clientMsgId === meta.clientMsgId) return item;
            }

        }

            if (!State.ws) return;

        function returnToEntry(message = '') {
            disconnectSocket();
            clearVisitorSession();
            resetConversationRuntime();
            resetChatView();
            hideEvalImmediately();
            updateSessionState('AI');
            State.startingConversation = false;
            DOM.entryBtn.disabled = false;
            DOM.entryBtn.textContent = t('consultService');

            State.pendingReturnToEntry = false;
            State.connected = false;
            disconnectSocket();
            updateSessionState('ENDED');
            if (!State.visitorToken || !State.conversationId || State.ratingSubmitted) {
                returnToEntry(message);

        async function openConsultation() {
            if (State.startingConversation) return;
            State.startingConversation = true;
            DOM.entryBtn.disabled = true;
            DOM.entryBtn.textContent = t('connecting');
            clearVisitorSession();
            resetConversationRuntime();
            resetChatView();
            updateSessionState('AI');
            if (isEmbedMode()) {
                showChatView();
            }
            const ok = await initConversation();
            State.startingConversation = false;
            DOM.entryBtn.disabled = false;
            DOM.entryBtn.textContent = t('consultService');
            if (!ok) return;
            showChatView();
            saveVisitorSession();
            scrollToBottom();
        }

        async function restoreConsultation(savedSession) {
            const saved = savedSession || loadVisitorSession();
            if (!saved) return false;
            disconnectSocket();
            resetConversationRuntime();
            resetChatView();
            hideEvalImmediately();
            updateSessionState('AI');
            await loadContactSettings();
            State.visitorToken = saved.visitorToken;
            State.conversationId = saved.conversationId;
            // 恢复旧会话时，把当前网站语言同步给后端：
            // 会话语言是创建时记录的，访客切换网站语言后若不同步，
            // AI 会继续按旧语言（如中文）回复。
            // B14：该接口同时返回会话状态，用于判断历史会话是否已结束。
            const restoredConversation = await syncVisitorLangToServer();
            if (restoredConversation) applyAssignedAgent(restoredConversation);
            State.startingConversation = false;
            DOM.entryBtn.disabled = false;
            DOM.entryBtn.textContent = t('consultService');
            showChatView();
            updateSessionState(saved.sessionType || 'AI');
            let syncState = null;
            try {
                syncState = await syncMessages();
            } catch (err) {
                console.error(err);
            }
            if (syncState === false) {
                returnToEntry(t("sessionExpired"));
                return false;
            }
            if (!State.quickRepliesRendered) {
                renderQuickRepliesCard();
            }
            // B14：会话已结束时保留历史渲染，展示"会话已结束"状态与评价入口。
            if (restoredConversation && restoredConversation.status === 'closed') {
                enterEndedSessionState({ keepHistory: true });
                scrollToBottom();
                return true;
            }
            saveVisitorSession();
            connectSocket();
            scrollToBottom();
            return true;
        }

        async function bootApp() {
            let savedSession = loadVisitorSession();
            // iframe 自身存储被拦截/清空时，向主站第一方存储取回会话令牌。
            if (!savedSession && isEmbedMode()) {
                savedSession = await requestHostSession();
            }
            if (savedSession) {
                const restored = await restoreConsultation(savedSession);
                if (restored) return;
            }
            if (isEmbedMode()) {
                await openConsultation();
                return;
            }
            returnToEntry();
        }

        // === 消息构建与收发逻辑 ===

        // 构建普通文本消息
        function createMessageHTML(text, isUser = false, isFailed = false, meta = {}, extraBubbleClass = '', aiTag = false) {
            const safeText = escapeHTML(text).replace(/\n/g, '<br>');
            const avatar = isUser ? visitorAvatar() : agentAvatarURL();

            const failIcon = (isUser && isFailed) ? retryIconHTML(text) : '';

            // 客服/AI 头像旁显示名字（B12：使用真实客服名，缺失时回退默认文案）。
            const nameLabel = !isUser ? `<span class="text-[11px] text-gray-500 ml-1 mb-1 block">${escapeHTML(agentDisplayName())}</span>` : '';
            // AI 生成消息气泡下方的小标识
            const aiTagLabel = (!isUser && aiTag) ? `<span class="ai-tag text-[10px] text-gray-400 mt-1 ml-1 block select-none" dir="auto">${t('aiGenerated')}</span>` : '';

            return `

                    <div class="flex flex-col max-w-[70%] ${isUser ? 'items-end' : 'items-start'}">
                        ${nameLabel}
                        <div class="flex items-center ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                            <div class="${bubbleBg} ${textStyle} text-[16px] p-2.5 rounded-lg shadow-sm relative ${bubbleDir} leading-relaxed word-break-all min-h-[40px] flex items-center ${extraBubbleClass}">
                                ${safeText}
                            </div>
                            ${failIcon}
                        </div>
                        ${aiTagLabel}
                    </div>
                </div>

        }

        // 构建图片消息 (微信中的图片没有气泡尖角和背景)
        function createImageMessageHTML(imgSrc, isUser = false, meta = {}, aiTag = false, isFailed = false) {
            const avatar = isUser ? visitorAvatar() : agentAvatarURL();

        function createRevokedMessageHTML(text, isUser = false, meta = {}) {
            return createMessageHTML(text, isUser, false, meta, 'bubble-revoked italic');
        }

        function buildServerMessageHTML(msg, isUser = false) {
            const meta = {
                serverMsgId: msg.server_msg_id || '',
                clientMsgId: msg.client_msg_id || ''
            };
            const aiTag = !isUser && (msg.sender_type === 'ai' || msg.message_type === 'ai_text');
            // 初始消息（如欢迎语）服务端可能还带着译文，优先使用当前语言的译文展示。
            const translations = msg.translations || {};
            const lang = window.__CHAT_LANG__ || 'zh';
            if (!isUser && translations[lang] && String(translations[lang]).trim()) {
                msg = { ...msg, content: translations[lang] };
            }
            if (msg.message_type === 'image') {
                return createImageMessageHTML(resolveAssetURL(msg.content), isUser, meta, aiTag);
            }
            if (msg.message_type === 'audio') {
                return createAudioMessageHTML(resolveAssetURL(msg.content), isUser, meta, aiTag);
            }
            if (msg.message_type === 'revoked' || msg.revoked_at) {
                return createRevokedMessageHTML(msg.content || t('messageRecalled'), isUser, meta);
            }
            return createMessageHTML(msg.content || '', isUser, false, meta, '', aiTag);
        }

        function removeQuickReplyCards() {
            DOM.chatList.querySelectorAll('.quick-replies-card').forEach((node) => node.remove());
        }

        function bindQuickReplyActions(root) {
            root.querySelectorAll('[data-quick-reply]').forEach((button) => {
                button.addEventListener('click', () => {
                    const displayText = button.dataset.quickReply || '';
                    const sendText = button.dataset.sendText || displayText;
                    removeQuickReplyCards();
                    handleSend(sendText, displayText);
                });
            });
        }

        function renderQuickRepliesCard() {
            removeQuickReplyCards();
            if (!State.quickReplies.length) return;
            const items = State.quickReplies.map((item, index) => `
                <button
                    type="button"
                    class="w-full text-left text-sm text-[#576b95] active:bg-gray-100 px-1 py-1.5 rounded transition-colors"
                    data-quick-reply="${escapeHTML(item.text || '')}"
                    data-send-text="${escapeHTML(item.send_text || item.text || '')}"
                >${index + 1}. ${escapeHTML(item.text || '')}</button>
            `).join('');
            const html = `
                <div class="flex gap-3 msg-wrapper quick-replies-card">
                    <div class="w-10 shrink-0"></div>
                    <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200/50 w-[75%]">

            `;
            const div = document.createElement('div');
            div.innerHTML = html.trim();

            State.quickRepliesRendered = true;
