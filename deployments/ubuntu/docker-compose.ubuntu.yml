services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      SERVICE_DOMAIN: ${SERVICE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      admin-server:
        condition: service_started
      servicebridge-user-web:
        condition: service_started
      servicebridge-backend-1:
        condition: service_started
      servicebridge-backend-2:
        condition: service_started
    networks:
      - astreva

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../servicebridge/backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - astreva

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - astreva

  servicebridge-backend-1:
    build:
      context: ../../
      dockerfile: deployments/ubuntu/servicebridge-backend.Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: "production"
      STORE_DRIVER: "postgres"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      AGENT_BOOTSTRAP_PASSWORD: ${AGENT_BOOTSTRAP_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      SECURITY_HEADERS: ${SECURITY_HEADERS}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_API_TYPE: ${OPENAI_API_TYPE}
      UPLOAD_DRIVER: ${UPLOAD_DRIVER}
      UPLOAD_DIR: "/uploads"
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      NODE_ID: "servicebridge-backend-1"
    volumes:
      - servicebridge-uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - astreva

  servicebridge-backend-2:
    build:
      context: ../../
      dockerfile: deployments/ubuntu/servicebridge-backend.Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: "production"
      STORE_DRIVER: "postgres"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      AGENT_BOOTSTRAP_PASSWORD: ${AGENT_BOOTSTRAP_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      SECURITY_HEADERS: ${SECURITY_HEADERS}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_API_TYPE: ${OPENAI_API_TYPE}
      UPLOAD_DRIVER: ${UPLOAD_DRIVER}
      UPLOAD_DIR: "/uploads"
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      NODE_ID: "servicebridge-backend-2"
    volumes:
      - servicebridge-uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - astreva

  servicebridge-user-web:
    build:
      context: ../../
      dockerfile: deployments/ubuntu/servicebridge-user-web.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - astreva

  admin-server:
    build:
      context: ../../
      dockerfile: deployments/ubuntu/admin-server.Dockerfile
    restart: unless-stopped
    depends_on:
      servicebridge-backend-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "1337"
      PUBLIC_ADMIN_ORIGIN: "https://${ADMIN_DOMAIN}"
      PUBLIC_SITE_URL: "https://${SITE_DOMAIN}"
      ADMIN_CORS_ALLOWED_ORIGINS: "https://${SITE_DOMAIN}"
      ADMIN_TRUST_PROXY: "true"
      PUBLIC_SERVICEBRIDGE_URL: "https://${SERVICE_DOMAIN}"
      PUBLIC_ADMIN_URL: "https://${ADMIN_DOMAIN}"
      SERVICEBRIDGE_API_URL: "http://servicebridge-backend-1:8080"
      SERVICEBRIDGE_ADMIN_ACCOUNT: ${SERVICEBRIDGE_ADMIN_ACCOUNT:-superadmin}
      SERVICEBRIDGE_ADMIN_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      CMS_STORE_DRIVER: "postgres"
      DATABASE_URL: ${DATABASE_URL}
      CMS_DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ADMIN_METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      ADMIN_MEDIA_DRIVER: ${ADMIN_MEDIA_DRIVER:-s3}
      ADMIN_ALLOW_LOCAL_MEDIA: ${ADMIN_ALLOW_LOCAL_MEDIA:-false}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      ADMIN_S3_KEY_PREFIX: ${ADMIN_S3_KEY_PREFIX:-site-admin}
      ADMIN_S3_SERVER_SIDE_ENCRYPTION: ${ADMIN_S3_SERVER_SIDE_ENCRYPTION}
      ADMIN_UPLOAD_MAX_BYTES: ${ADMIN_UPLOAD_MAX_BYTES:-209715200}
      ADMIN_IMAGE_VARIANT_WIDTHS: ${ADMIN_IMAGE_VARIANT_WIDTHS:-400,800,1200,1600}
      ADMIN_IMAGE_WEBP_QUALITY: ${ADMIN_IMAGE_WEBP_QUALITY:-82}
      ADMIN_IMAGE_MAX_PIXELS: ${ADMIN_IMAGE_MAX_PIXELS:-80000000}
      ADMIN_OPENAI_IMAGE_API_KEY: ${ADMIN_OPENAI_IMAGE_API_KEY:-}
      ADMIN_OPENAI_IMAGE_BASE_URL: ${ADMIN_OPENAI_IMAGE_BASE_URL:-https://api.openai.com/v1}
      ADMIN_OPENAI_IMAGE_MODEL: ${ADMIN_OPENAI_IMAGE_MODEL:-gpt-image-1}
      ADMIN_AI_IMAGE_MODELS: ${ADMIN_AI_IMAGE_MODELS:-gpt-image-1,dall-e-3,dall-e-2}
      ADMIN_AI_ALLOWED_HOSTS: ${ADMIN_AI_ALLOWED_HOSTS:-api.openai.com}
      ADMIN_AI_IMAGE_DOWNLOAD_HOSTS: ${ADMIN_AI_IMAGE_DOWNLOAD_HOSTS:-api.openai.com,oaidalleapiprodscus.blob.core.windows.net}
      FRONTEND_REBUILD_WEBHOOK_URL: "http://rebuild-webhook:${REBUILD_WEBHOOK_PORT}/rebuild"
      ADMIN_2FA_SESSION_SECRET: ${ADMIN_2FA_SESSION_SECRET}
      ADMIN_2FA_ISSUER: ${ADMIN_2FA_ISSUER}
      ADMIN_2FA_SESSION_TTL_MS: ${ADMIN_2FA_SESSION_TTL_MS}
      REBUILD_WEBHOOK_SECRET: ${REBUILD_WEBHOOK_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      PREVIEW_COOKIE_DOMAIN: ${PREVIEW_COOKIE_DOMAIN:-}
    volumes:
      - admin-data:/app/data
      - admin-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1337/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - astreva

  rebuild-webhook:
    build:
      context: ../../
      dockerfile: deployments/ubuntu/rebuild-webhook.Dockerfile
    restart: unless-stopped
    environment:
      REBUILD_WEBHOOK_PORT: ${REBUILD_WEBHOOK_PORT}
      REBUILD_WEBHOOK_SECRET: ${REBUILD_WEBHOOK_SECRET}
      FALLBACK_CONTENT_URL: "http://admin-server:1337/site-admin-api/public-fallback-content"
      PUBLISH_DIR: "/published"
      PUBLIC_SITE_URL: "https://${SITE_DOMAIN}"
      PUBLIC_SERVICEBRIDGE_URL: "https://${SERVICE_DOMAIN}"
      PUBLIC_ADMIN_URL: "https://${ADMIN_DOMAIN}"
      PUBLIC_LEADS_ENDPOINT: "/site-admin-api/leads"
      CONTENT_API_URL: "http://admin-server:1337"
    volumes:
      - rebuild-webhook-home:/home/appuser
      - frontend-published:/published
    depends_on:
      admin-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${REBUILD_WEBHOOK_PORT}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - astreva

  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile
    depends_on:
      rebuild-webhook:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - frontend-published:/usr/share/nginx/site:ro
    networks:
      - astreva

  # ---------------------------------------------------------------- 监控（profile: monitoring，默认不启动）
  # 启用：docker compose --env-file deployments/ubuntu/.env.ubuntu --profile monitoring up -d
  # 端口只绑定宿主机回环（PROMETHEUS_HOST_PORT / GRAFANA_HOST_PORT 默认 127.0.0.1），
  # 需要从外部访问时请自行加 SSH 隧道或反向代理，不要把 9090/3000 直接暴露到公网。
  # Prometheus token 不落仓库：启动时从 ${METRICS_BEARER_TOKEN} 写入容器内凭据文件。
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /tmp/prometheus-secrets
        printf '%s' "$$METRICS_BEARER_TOKEN" > /tmp/prometheus-secrets/metrics_bearer_token
        chmod 0400 /tmp/prometheus-secrets/metrics_bearer_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time="$$PROMETHEUS_RETENTION" \
          --web.listen-address=0.0.0.0:9090
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN 未配置：请先复制 deployments/ubuntu/.env.ubuntu.example 为 .env.ubuntu 并填入强随机 token}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-127.0.0.1:9090}:9090"
    networks:
      - astreva

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 未配置：请在 .env.ubuntu 中设置强随机密码}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-127.0.0.1:3000}:3000"
    depends_on:
      - prometheus
    networks:
      - astreva

volumes:
  postgres-data:
  redis-data:
  servicebridge-uploads:
  admin-data:
  admin-uploads:
  caddy-data:
  caddy-config:
  rebuild-webhook-home:
  frontend-published:
  prometheus-data:
  grafana-data:

networks:
  astreva:
    name: astreva-ubuntu
