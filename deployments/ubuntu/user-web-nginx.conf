server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    # 官网是 Astro 预渲染产物（不是 SPA），没有客户端路由，未匹配地址必须真的回 404，
    # 交给下面的 error_page 渲染 404.html。原先回落到 /index.html 会让所有错地址都返回
    # 首页 + 200：既看不到后台可配置的 404 页，又让搜索引擎把大量错链当成重复首页（软 404）。
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
  }
}
