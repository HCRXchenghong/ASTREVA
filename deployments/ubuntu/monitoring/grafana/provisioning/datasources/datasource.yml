# Grafana 数据源自动配置（monitoring profile）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 保持一致，避免 Grafana 做出错误的插值。
      timeInterval: 15s
      httpMethod: POST
