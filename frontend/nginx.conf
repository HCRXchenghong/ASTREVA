server {
  listen 80;
  server_name _;
  root /usr/share/nginx/site/current;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 草稿预览产物与正式发布共用同一个静态卷，位于 preview/ 子目录，
  # 通过 /__preview/ 访问，生命周期独立于 current。
  location /__preview/ {
    alias /usr/share/nginx/site/preview/;
    try_files $uri $uri/ /__preview/index.html;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /404.html;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
